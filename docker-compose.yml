version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: lppm-press-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-lppm}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lppm_secret}
      POSTGRES_DB: ${DATABASE_NAME:-lppm_press}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - lppm_pgdata:/var/lib/postgresql/data
volumes:
  lppm_pgdata:
